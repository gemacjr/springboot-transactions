spring.application.name=springboot-transactions

spring.datasource.url=jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Keep transaction boundaries honest: no persistence context spanning the whole HTTP request.
spring.jpa.open-in-view=false

# Logs "Creating new transaction", "Participating in existing transaction", "Suspending current transaction", etc.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
